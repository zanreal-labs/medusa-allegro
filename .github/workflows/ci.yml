name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is current LTS.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # @zanreal/medusa-admin-kit is a private sibling repo, installed straight
      # from git. The runner has no SSH key, so rewrite the ssh:// (and the
      # scp-like git@github.com: form other plugins' lockfiles use) to an
      # https URL authenticated with a token instead.
      - name: Authenticate git for the private admin-kit dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.ADMIN_KIT_READ_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ secrets.ADMIN_KIT_READ_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: DEBUG git config state
        run: |
          echo "HOME=$HOME"
          git config --global --list --show-origin || true
          echo "--- env GIT_* ---"
          env | grep -i '^GIT_' || true
          echo "--- direct ls-remote trace ---"
          GIT_TRACE=1 git ls-remote ssh://git@github.com/zanreal-labs/medusa-admin-kit.git 2>&1 | head -20 || true

      - name: Install
        run: npm ci

      - name: Lint
        run: npx medusa lint

      - name: Typecheck
        run: npm run test:types

      - name: Unit tests
        run: npm run test:unit

      # Compiles src to .medusa/server and bundles the admin extension. This is
      # the step that catches a broken export map or an admin route that only
      # type-checks in isolation.
      - name: Build
        run: npx medusa plugin:build

  migrations-up-to-date:
    name: Migrations match the models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_allegro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See the matching step in the verify job: without this, npm ci tries
      # to fetch @zanreal/medusa-admin-kit over ssh:// and the runner has no key.
      - name: Authenticate git for the private admin-kit dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.ADMIN_KIT_READ_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ secrets.ADMIN_KIT_READ_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install
        run: npm ci

      # A model change without a regenerated migration is invisible until someone
      # deploys and the table is missing a column. Generating here and failing on
      # a dirty tree makes that a review-time error instead.
      - name: Generate migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_allegro_ci
        run: npx medusa plugin:db:generate

      - name: Fail if a migration is missing
        run: |
          if [ -n "$(git status --porcelain src/modules)" ]; then
            echo "Models changed without a regenerated migration."
            echo "Run 'npx medusa plugin:db:generate' and commit the result."
            git status --porcelain src/modules
            git diff -- src/modules
            exit 1
          fi
