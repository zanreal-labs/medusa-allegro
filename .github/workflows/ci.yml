name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is current LTS.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx medusa lint

      - name: Typecheck
        run: npm run test:types

      - name: Unit tests
        run: npm run test:unit

      # Compiles src to .medusa/server and bundles the admin extension. This is
      # the step that catches a broken export map or an admin route that only
      # type-checks in isolation.
      - name: Build
        run: npx medusa plugin:build

  migrations-up-to-date:
    name: Migrations match the models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_allegro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # fetch-depth: 0 because the snapshot check below diffs across the pushed
      # commit range, which a shallow clone cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A model change without a regenerated migration is invisible until someone
      # deploys and the table is missing a column. Generating here and failing on
      # a dirty tree makes that a review-time error instead.
      - name: Generate migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_allegro_ci
        run: npx medusa plugin:db:generate

      - name: Fail if a migration is missing
        run: |
          if [ -n "$(git status --porcelain src/modules)" ]; then
            echo "Models changed without a regenerated migration."
            echo "Run 'npx medusa plugin:db:generate' and commit the result."
            git status --porcelain src/modules
            git diff -- src/modules
            exit 1
          fi

      # The hole the step above cannot see, and the reason there are two guards.
      #
      # `plugin:db:generate` diffs the models against the SNAPSHOT, not against the
      # database. So a commit that carries the updated snapshot but never `git add`ed
      # the generated `Migration*.ts` is completely silent above: the tree is clean,
      # the migration file is simply absent, and regenerating reports "No migration
      # created" because the snapshot already accounts for the schema. The column is
      # then missing from the table on deploy.
      #
      # Forgetting `git add` on a new file is an ordinary mistake, so this checks the
      # pushed range directly: if the snapshot moved, a migration must have been ADDED
      # alongside it. `--diff-filter=A` is load-bearing - a modified migration is not
      # a new one.
      #
      # Verified by construction rather than by reasoning (committing snapshot+model
      # and deleting the migration really does pass the step above), and all six paths
      # rehearsed: the hole fires, a correct snapshot+migration commit passes, an
      # unrelated commit skips, and an all-zero base, an empty base and a base absent
      # after a force push each skip cleanly instead of crashing the job. That last
      # group matters - a guard that reddens CI on an unrelated force push gets
      # disabled by the third person it inconveniences.
      #
      # Credit where it is due: this hole was not reasoned out here. A sibling
      # ZanReal Medusa plugin shipped a migration-less snapshot commit straight
      # through the step above, and this guard is ported from the fix.
      - name: Fail if the snapshot moved without a new migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit (new branch, or a manual run) - skipping."
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "Base commit $BASE_SHA is not in this repository (likely a force push) - skipping."
            exit 0
          fi

          snapshot_changed=$(git diff --name-only "$BASE_SHA" HEAD -- src/modules \
            | { grep -E '/\.snapshot-.*\.json$' || true; })
          if [ -z "$snapshot_changed" ]; then
            echo "The migration snapshot did not change in this range - nothing to check."
            exit 0
          fi

          migration_added=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- src/modules \
            | { grep -E '/Migration[0-9]+\.ts$' || true; })
          if [ -n "$migration_added" ]; then
            echo "Snapshot moved and a migration was added:"
            echo "$migration_added" | sed 's/^/  /'
            exit 0
          fi

          echo "The migration snapshot changed but NO migration file was added in this range."
          echo
          echo "This is almost always a forgotten 'git add' on a newly generated migration."
          echo "It is invisible to the regenerate-and-check step above, because"
          echo "plugin:db:generate diffs the models against the SNAPSHOT, not the database:"
          echo "once the updated snapshot is committed, regenerating reports 'No migration"
          echo "created' and the tree stays clean. The column would be missing on deploy."
          echo
          echo "Fix: commit the generated Migration*.ts alongside the snapshot."
          echo
          echo "Snapshot files changed in this range:"
          echo "$snapshot_changed" | sed 's/^/  /'
          exit 1
